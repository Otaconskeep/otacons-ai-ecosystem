# Otacon Expansion — managed local n8n (workflow automation).
# Start: docker compose -f deploy/n8n/docker-compose.yml up -d
# UI: http://127.0.0.1:5678  Health: /healthz
services:
  otacon-n8n:
    image: n8nio/n8n:latest
    container_name: otacon-n8n
    ports:
      - "5678:5678"
    restart: unless-stopped
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - otacon-n8n-data:/home/node/.n8n
volumes:
  otacon-n8n-data:
