# Otacon Expansion — optional ComfyUI sidecar (Studio READY, models later).
# Fixed host port 8188. Start: docker compose -f deploy/comfyui/docker-compose.yml up -d
services:
  otacon-comfyui:
    image: yanwk/comfyui-boot:cpu
    container_name: otacon-comfyui
    ports:
      - "8188:8188"
    restart: unless-stopped
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      - otacon-comfy-data:/root
      # Creative packs (Z-Image / Wan·LTX-2 / ACE-Step) land here via studio_packs.
      - otacon-comfy-models:/root/ComfyUI/models
volumes:
  otacon-comfy-data:
  otacon-comfy-models:
