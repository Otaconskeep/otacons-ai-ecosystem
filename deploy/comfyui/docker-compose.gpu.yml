# Otacon Expansion — GPU ComfyUI sidecar when Studio profile selects comfy_runtime=gpu.
# Image is generation-aware via OTACON_COMFY_GPU_IMAGE (set by hardware_profile / ensure_comfy):
#   RTX 50 (Blackwell) → cu130-slim-v2; RTX 20/30/40 → cu126-slim (fallbacks include cu124-slim).
# NEVER use bare :cu124 — that tag 404s on Docker Hub.
services:
  otacon-comfyui:
    image: ${OTACON_COMFY_GPU_IMAGE:-yanwk/comfyui-boot:cu126-slim}
    container_name: otacon-comfyui
    ports:
      - "8188:8188"
    restart: unless-stopped
    gpus: all
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --port 8188
    volumes:
      - otacon-comfy-data:/root
      # Creative packs (Z-Image / Wan·LTX-2 / ACE-Step) land here via studio_packs.
      - otacon-comfy-models:/root/ComfyUI/models
volumes:
  otacon-comfy-data:
  otacon-comfy-models:
